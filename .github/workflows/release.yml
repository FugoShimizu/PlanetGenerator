name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: planet-generator-release
  cancel-in-progress: false

jobs:
  contracts:
    name: Core contracts
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Build and run standalone Core contracts
        shell: pwsh
        run: ./Scripts/UE/Test-Core.ps1 -Suite All

  package:
    name: Package Windows game
    needs: contracts
    runs-on: [self-hosted, Windows, X64, ue-5-8]
    timeout-minutes: 180
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Build, cook, and archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw 'Release tag must be a semantic version.'
          }
          $project = Join-Path $env:GITHUB_WORKSPACE 'PlanetGenerator.uproject'
          $manifestPath = Join-Path $env:ProgramData 'Epic\UnrealEngineLauncher\LauncherInstalled.dat'
          if (-not (Test-Path -LiteralPath $manifestPath)) { throw 'UE launcher installation manifest is missing.' }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $engines = @($manifest.InstallationList | Where-Object AppName -EQ 'UE_5.8')
          if ($engines.Count -ne 1) { throw 'Exactly one UE 5.8 installation is required.' }
          $uat = Join-Path $engines[0].InstallLocation 'Engine\Build\BatchFiles\RunUAT.bat'
          if (-not (Test-Path -LiteralPath $uat)) { throw 'RunUAT.bat is missing.' }
          $archive = Join-Path $env:RUNNER_TEMP 'PlanetGeneratorRelease'
          $arguments = @(
            'BuildCookRun', "-project=$project", '-noP4', '-platform=Win64',
            '-clientconfig=Shipping', '-build', '-cook', '-stage', '-pak', '-archive',
            "-archivedirectory=$archive", '-prereqs', '-utf8output', '-unattended',
            '-ubtargs=-MaxParallelActions=1 -UBANoDetour -UBAStoreCapacityGb=1'
          )
          & $uat @arguments
          if ($LASTEXITCODE -ne 0) { throw "UE packaging failed with exit code $LASTEXITCODE." }
          $game = Get-ChildItem -LiteralPath $archive -Recurse -File -Filter PlanetGenerator.exe | Select-Object -First 1
          if (-not $game) { throw 'Packaged PlanetGenerator.exe was not found.' }
          $zip = Join-Path $env:RUNNER_TEMP "PlanetGenerator-$env:GITHUB_REF_NAME-Win64.zip"
          Compress-Archive -Path (Join-Path $archive '*') -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $zip)) { throw 'Release archive was not created.' }
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: PlanetGenerator-Win64
          path: ${{ runner.temp }}/PlanetGenerator-${{ github.ref_name }}-Win64.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: PlanetGenerator-Win64
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          fail_on_unmatched_files: true
          prerelease: true
          body: |
            Development preview of the Procedural Planet Terrain Generator.
            Global terrain, river-water continuity, and traversal performance remain under validation.
